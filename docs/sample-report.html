<meta charset="utf-8">
<title>Pitwall</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
/* The pit wall as an amber terminal. One phosphor, four intensities and nothing
   else: dim for labels, normal for text, bright for the numbers that decide,
   reverse video for headers and alarms. Left column is what to think about,
   right column is what happened. Charts are CSS grids, so they stretch to the
   screen and never drift by a cell. Single theme by design. */
html{color-scheme:dark}
*{box-sizing:border-box}
:root{
  --ground:#15110E; --screen:#1F1813; --glass:#2A2118;
  --amber:#EDA52E; --bright:#FFCB63; --dim:#8F6A28; --faint:#3A2C13; --rule:#6E5320; --hair:#2E2310; --fill:#E4A02D; --ink:#1F1813;
  --mono:"VT323",ui-monospace,Menlo,Consolas,monospace;
}
body{margin:0;background:var(--ground);color:var(--amber);font:20px/1.15 var(--mono);padding:22px 10px 64px}
.crt{width:min(100% - 8px,1320px);margin:0 auto;background:radial-gradient(ellipse at 50% 35%,var(--glass) 0,var(--screen) 58%,#181310 100%);border-radius:22px;padding:28px 30px 32px;
  box-shadow:inset 0 0 90px rgba(0,0,0,.55),0 0 0 12px #2B2622,0 0 0 14px #0E0B09,0 30px 60px rgba(0,0,0,.6);
  text-shadow:0 0 6px rgba(237,165,46,.4),0 0 1px rgba(255,200,90,.6)}
.wr{overflow-wrap:anywhere}
b{font-weight:400;color:var(--bright);text-shadow:0 0 9px rgba(255,203,99,.6),0 0 1px #FFE3A6}
.dim{color:var(--dim);text-shadow:none}
.rv{background:var(--fill);color:var(--ink);text-shadow:none}
.rv b{color:var(--ink);text-shadow:none}
.bar{display:flex;justify-content:space-between;gap:12px 24px;padding:0 8px;flex-wrap:wrap}
.bar>span{display:inline-flex;gap:1.5em;flex-wrap:wrap}
a{color:inherit}

/* two columns of sections */
.two{display:grid;grid-template-columns:36fr 64fr;gap:0 30px;margin-top:20px}
.col>section{padding:0 0 14px;margin-bottom:14px;border-bottom:1px solid var(--faint)}
.col>section:last-child{border-bottom:none}
h3{margin:0 0 8px;font:inherit;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h3 .rv{padding:0 6px}
h3 .sub{color:var(--dim);text-shadow:none}

.cmd{margin:0 0 10px 2px}
.cmd:last-child{margin:14px 0 0 2px}
.cur{display:inline-block;width:.6em;height:1em;background:var(--amber);vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
.head{font-size:1.5em;line-height:1.1;margin:2px 0 8px}
.lk{display:inline-block;width:4.5em;height:.55em;background:#4A3816;vertical-align:middle;margin-right:8px}
.lk i{display:block;height:100%;background:var(--fill);box-shadow:0 0 6px rgba(237,165,46,.45)}
/* verdict */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:6px}
.tile .n{display:block;font-size:2em;line-height:1;margin-top:.15em}
.tile .n small{font-size:.5em;color:var(--amber)}
.tile .t{display:block;margin-top:4px}
.tile .e{display:block}
.dl{font-size:.5em;margin-left:10px;vertical-align:middle;text-shadow:none;white-space:nowrap}
.dl.up{color:var(--bright)} .dl.dn{background:var(--fill);color:var(--ink);padding:0 5px}
.wr .dl{font-size:.85em;margin-left:8px}
.gauge{display:flex;align-items:center;margin-top:12px}
.gauge i{display:inline-block;height:.7em;background:var(--fill);box-shadow:0 0 8px rgba(237,165,46,.5)}
.gauge u{display:inline-block;height:.7em;background:#4A3816;text-decoration:none}
.gauge .tick{width:2px;height:1.1em;background:var(--bright);margin-left:-1px}

/* lists: leaks, calls, keep */
.list>div{padding:6px 0;border-bottom:1px solid var(--faint)}
.list>div:last-child{border-bottom:none}
.list .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.list .h>span:last-child{white-space:nowrap}
.list p{margin:2px 0 0}

/* tables */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:0 30px}
.duo table,.duo .cap{font-size:.9em}
@media (max-width:1180px){.duo{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font:inherit}
th{text-align:left;color:var(--dim);font-weight:400;padding:0 6px 2px 0;border-bottom:1px solid var(--rule);text-shadow:none;vertical-align:bottom}
td{padding:3px 6px 3px 0;border-bottom:1px solid var(--hair);vertical-align:baseline;white-space:nowrap}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right;padding-right:0;padding-left:12px}
td .hb{display:inline-block;height:.55em;background:var(--fill);vertical-align:middle;margin-right:6px;box-shadow:0 0 6px rgba(237,165,46,.45)}
.cap{color:var(--dim);text-shadow:none;margin-top:6px}

/* the week: a grid of cells, one per step */
.g{display:grid;grid-template-columns:7.2em 1fr 3.4em;gap:3px 10px;align-items:center}
.g .hd{position:relative;height:1.1em}
.g .hd span{position:absolute;transform:translateX(-50%);color:var(--dim);text-shadow:none}
.g .lab{white-space:nowrap}
.g .tot{text-align:right;white-space:nowrap}
.g .row{display:grid;grid-template-columns:repeat(var(--n),1fr);height:1.15em;position:relative}
.g .row::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to right,transparent 0 calc(100%/var(--hrs) - 1px),#2A2010 calc(100%/var(--hrs) - 1px) calc(100%/var(--hrs)))}
.g .row i{display:block;position:relative;height:100%}
.g .c1{background:repeating-conic-gradient(#D9962A 0 25%,transparent 0 50%) 0 0/4px 4px}
.g .c2{background:var(--fill);box-shadow:0 0 5px rgba(237,165,46,.35)}
.g .c3{background:var(--bright);box-shadow:0 0 9px rgba(255,203,99,.7)}
.g .ci{background:radial-gradient(circle,#A87A2A 1.5px,transparent 2px)}
.g .row i:hover{outline:1px solid #FFE3A6;z-index:1}
.g .lab,.g .row{cursor:pointer}
.g .lab.sel{background:var(--fill);color:var(--ink);text-shadow:none;padding:0 5px;margin-left:-5px}
.g .row.sel::before{background:repeating-linear-gradient(to right,rgba(228,160,45,.12) 0 calc(100%/var(--hrs) - 1px),#4A3816 calc(100%/var(--hrs) - 1px) calc(100%/var(--hrs)))}
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:8px;color:var(--dim);text-shadow:none}
.legend i{display:inline-block;width:1.4em;height:.85em;vertical-align:-2px;margin-right:6px}

/* hours: 24 bars */
.hc{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;align-items:end;height:132px;margin-top:6px}
.hc i{display:block;background:var(--fill);box-shadow:0 0 6px rgba(237,165,46,.4)}
.hc i.pk{background:var(--bright);box-shadow:0 0 10px rgba(255,203,99,.7)}
.hc i.z{background:var(--hair);height:2px!important;box-shadow:none}
.hl{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;text-align:center;margin-top:3px}
.hl span{color:var(--dim);text-shadow:none;font-size:.9em;overflow:hidden}
.hl.p span{color:#B98A3A}
.hc i{cursor:pointer}
a.dim{cursor:pointer;text-decoration:none}
a.dim:hover{color:var(--bright)}
.dnote{margin:0 0 6px}
/* the day picker: a details element drawn as a terminal menu */
.dd{position:relative;display:inline-block}
.dd summary{list-style:none;cursor:pointer;border:1px solid var(--rule);padding:0 8px;white-space:nowrap;color:var(--amber)}
.dd summary::-webkit-details-marker{display:none}
.dd summary::after{content:" \25BE";color:var(--dim)}
.dd summary:hover,.dd[open] summary{border-color:var(--bright);color:var(--bright)}
.dd menu{position:absolute;left:0;top:100%;z-index:5;margin:2px 0 0;padding:2px 0;list-style:none;min-width:100%;background:var(--screen);border:1px solid var(--rule);box-shadow:0 8px 24px rgba(0,0,0,.6)}
.dd li{padding:0 8px;white-space:nowrap;cursor:pointer}
.dd li:hover,.dd li.sel{background:var(--fill);color:var(--ink);text-shadow:none}
.dd li.sel::after{content:" *"}
h3 .dd{font-size:1em}
/* by task kind: delivered, then the tail that sat waiting */
.hs{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;font-size:.9em}
.hs .hd{color:var(--dim);text-shadow:none;border-bottom:1px solid var(--rule);padding-bottom:2px;white-space:nowrap}
.hs .bb{display:flex;height:1.05em;gap:2px}
.hs .bb i{display:block;height:100%}
.hs .bb .w{background:var(--fill);box-shadow:0 0 6px rgba(237,165,46,.45)}
.hs .bb .s{background:radial-gradient(circle,#A87A2A 1.5px,transparent 2px) 0 0/6px 6px}
.hs .n{white-space:nowrap;text-align:right}
.hs .n small{color:var(--dim);text-shadow:none;font-size:1em}
.card{border:1px solid var(--rule);padding:10px 12px 10px;margin-top:12px}
.card .ch{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.card .ch .n2{font-size:1.6em;line-height:1}
.card .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0 10px;margin-top:8px;border-top:1px solid var(--faint);padding-top:6px}
.card .st b{display:block;font-size:1.3em;line-height:1.1}
.card .st b small{font-size:.6em;color:var(--amber)}
.card .st span{display:block;color:var(--dim);text-shadow:none}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.card .tag{border:1px solid var(--faint);padding:0 8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .tag small{color:var(--dim);margin-left:6px;text-shadow:none}
.card .note{margin-top:8px;border-top:1px solid var(--faint);padding-top:6px}
@media (max-width:900px){.card .stats{grid-template-columns:1fr 1fr}}

footer{margin-top:24px}
#tip{position:fixed;pointer-events:none;z-index:9;background:var(--glass);color:var(--amber);border:1px solid var(--rule);padding:5px 10px 6px;white-space:pre;opacity:0;transition:opacity .08s;max-width:440px;text-shadow:none;font:inherit;line-height:1.2;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#tip b{text-shadow:none}
@media (max-width:900px){.two,.duo{grid-template-columns:1fr}}
@media print{body{background:#fff;color:#000}.crt{box-shadow:none;background:#fff;text-shadow:none}}
</style>

<div class="crt">
  <div class="cmd dim" id="cmd"></div>
  <div class="bar rv" id="top"></div>
  <div class="two">
    <div class="col">

    <div class="col">

      <section id="tables"></section>
    </div>
  </div>
  <footer class="bar rv" id="foot"></footer>
  <div class="cmd dim">$ <span class="cur"></span></div>
</div>
<div id="tip"></div>

function mergeMs(spans, slack){ spans=spans.slice().sort((a,b)=>a[0]-b[0]); const out=[];
  for (const [a,b] of spans){ const Lx=out[out.length-1]; if (Lx && a-Lx[1]<=slack) Lx[1]=Math.max(Lx[1],b); else out.push([a,b]); } return out; }
const ovl=(a,b,c0,c1)=> Math.max(0,Math.min(b,c1)-Math.max(a,c0));
let h0=24, h1=0;
const prep = days.map(day=>{

  for (const l of day.lanes){ const sp=[]; for (const b of l.bars) if (b.k==="work"){ const s=[+new Date(b.a),+new Date(b.b)]; work.push(s); sp.push(s); }
    if (sp.length) lanes.push({project:l.project, title:l.title, spans:mergeMs(sp,0)}); }
  const w0=Math.min(...work.map(x=>x[0])), w1=Math.max(...work.map(x=>x[1]));
  const idle=[];
  for (const e of day.events){ if (e.kind!=="dead" && e.kind!=="starve") continue;
    const a=Math.max(+new Date(e.start), w0), b=Math.min(+new Date(e.end), w1);
    if (b-a >= 8*6e4) idle.push({a,b,kind:e.kind,n:e.n,holder:e.holder}); }
  for (const [a,b] of work){ h0=Math.min(h0,(a-mid)/36e5); h1=Math.max(h1,Math.min((b-mid)/36e5,24)); }
  return {day, mid, work, lanes, idle};
});

/* hours, one day or the whole window folded --------------------------------- */
function hoursFor(dayKey){
  const H = Array.from({length:24},()=>({sec:0, prompts:0, proj:{}, sess:{}, days:new Set(), peak:0, peakAt:null}));
  for (const day of days){
    if (dayKey && day.key!==dayKey) continue;
    const spans=[];
    for (const l of day.lanes) for (const b of l.bars) if (b.k==="work"){
      let a=+new Date(b.a), z=+new Date(b.b); spans.push([a,z]);
      while (a<z){ const d0=new Date(a), hr=d0.getHours();
        const nxt=Math.min(z, +new Date(d0.getFullYear(),d0.getMonth(),d0.getDate(),hr+1));
        const x=H[hr]; x.sec+=(nxt-a)/1e3; x.proj[l.project]=(x.proj[l.project]||0)+(nxt-a)/1e3;
        const nm = l.title ? `${l.project}: ${l.title}` : l.project;
        x.sess[nm]=(x.sess[nm]||0)+(nxt-a)/1e3;
        if ((nxt-a)>3e5) x.days.add(day.key);
        a=nxt; }
    }
    for (const p of day.prompts) H[new Date(p).getHours()].prompts++;
    const pts=[]; for (const [a,z] of spans){ pts.push([a,1]); pts.push([z,-1]); }
    pts.sort((x,y)=>x[0]-y[0]||x[1]-y[1]);
    let cur=0;
    for (const [t,d] of pts){ cur+=d; const x=H[new Date(t).getHours()]; if (cur>x.peak){ x.peak=cur; x.peakAt=t; } }
  }
  return H;
}

      <div class="hs"><div class="hd">kind</div><div class="hd">agent-hours, then hours sat waiting</div><div class="hd" style="text-align:right">sessions</div>
      ${ks.map(x=>`<div>${x.k}</div><div class="bb"><i class="w" style="width:${x.work_h/mk*100}%" data-t="${x.k}: ${x.work_h.toFixed(1)} agent-hours delivered in ${x.n} sessions; the agent runs ${hm(x.nt)} before it needs you, you come back in ${hm(x.it)}"></i><i class="s" style="width:${x.starved_h/mk*100}%" data-t="${x.k}: ${x.starved_h.toFixed(1)} agent-hours sat finished, waiting while you were in another session"></i></div><div class="n"><b>${x.work_h.toFixed(1)} h</b> <small>+${x.starved_h.toFixed(1)} waited</small> <small style="margin-left:8px">${x.n}</small></div>`).join("")}</div>
      <div class="cap wr">the dotted tail is work of that kind that sat finished while you were elsewhere. Hover a bar for the run and reply times. Kinds come from what the agent did, so trust the direction, not the decimals.</div></div>
    <div><h3><span class="rv"> BY PROJECT </span></h3>
      <table><tr><th>project</th><th class="r">sessions</th><th class="r">agent-h</th><th class="r">efficiency</th><th class="r">starved</th></tr>
      ${P.map(p=>`<tr><td>${esc(p.project)}</td><td class="r dim">${p.sessions}</td><td class="r"><span class="hb" style="width:${Math.max(2,p.work_h/mp*44)}px"></span>${p.work_h.toFixed(1)}</td><td class="r">${p.efficiency===hi?`<b>${pct(p.efficiency)}</b>`:p.efficiency===lo?`<span class="rv">${pct(p.efficiency)}</span>`:pct(p.efficiency)}</td><td class="r">${(p.starved_h||0).toFixed(1)} h</td></tr>`).join("")}</table>
      <div class="cap wr">efficiency: share of the attention a project consumed that was an agent actually working; bright is the best, reverse the worst.</div></div>
  </div>`; }
</script>
