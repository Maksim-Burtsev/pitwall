<meta charset="utf-8">
<title>Pitwall</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
/* The pit wall as an amber terminal. One phosphor, four intensities and nothing
   else: dim for labels, normal for text, bright for the numbers that decide,
   reverse video for headers and alarms. Left column is what to think about,
   right column is what happened. Charts are CSS grids, so they stretch to the
   screen and never drift by a cell. Single theme by design. */
html{color-scheme:dark}
*{box-sizing:border-box}
:root{
  --ground:#15110E; --screen:#1F1813; --glass:#2A2118;
  --amber:#EDA52E; --bright:#FFCB63; --dim:#8F6A28; --faint:#3A2C13; --rule:#6E5320; --hair:#2E2310; --fill:#E4A02D; --ink:#1F1813;
  --mono:"VT323",ui-monospace,Menlo,Consolas,monospace;
}
body{margin:0;background:var(--ground);color:var(--amber);font:20px/1.15 var(--mono);padding:22px 10px 64px}
.crt{width:min(100% - 8px,1320px);margin:0 auto;background:radial-gradient(ellipse at 50% 35%,var(--glass) 0,var(--screen) 58%,#181310 100%);border-radius:22px;padding:28px 30px 32px;
  box-shadow:inset 0 0 90px rgba(0,0,0,.55),0 0 0 12px #2B2622,0 0 0 14px #0E0B09,0 30px 60px rgba(0,0,0,.6);
  text-shadow:0 0 6px rgba(237,165,46,.4),0 0 1px rgba(255,200,90,.6)}
.wr{overflow-wrap:anywhere}
b{font-weight:400;color:var(--bright);text-shadow:0 0 9px rgba(255,203,99,.6),0 0 1px #FFE3A6}
.dim{color:var(--dim);text-shadow:none}
.rv{background:var(--fill);color:var(--ink);text-shadow:none}
.rv b{color:var(--ink);text-shadow:none}
.bar{display:flex;justify-content:space-between;gap:12px 24px;padding:0 8px;flex-wrap:wrap}
.bar>span{display:inline-flex;gap:1.5em;flex-wrap:wrap}
a{color:inherit}

/* two columns of sections */
.two{display:grid;grid-template-columns:36fr 64fr;gap:0 30px;margin-top:20px}
.col>section{padding:0 0 14px;margin-bottom:14px;border-bottom:1px solid var(--faint)}
.col>section:last-child{border-bottom:none}
h3{margin:0 0 8px;font:inherit;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h3 .rv{padding:0 6px}
h3 .sub{color:var(--dim);text-shadow:none}

/* verdict */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:6px}
.tile .n{display:block;font-size:2em;line-height:1;margin-top:.15em}
.tile .n small{font-size:.5em;color:var(--amber)}
.tile .t{display:block;margin-top:4px}
.tile .e{display:block}
.gauge{display:flex;align-items:center;margin-top:12px}
.gauge i{display:inline-block;height:.7em;background:var(--fill);box-shadow:0 0 8px rgba(237,165,46,.5)}
.gauge u{display:inline-block;height:.7em;background:#4A3816;text-decoration:none}
.gauge .tick{width:2px;height:1.1em;background:var(--bright);margin-left:-1px}

/* lists: leaks, calls, keep */
.list>div{padding:6px 0;border-bottom:1px solid var(--faint)}
.list>div:last-child{border-bottom:none}
.list .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.list .h>span:last-child{white-space:nowrap}
.list p{margin:2px 0 0}

/* tables */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:0 30px}
table{border-collapse:collapse;width:100%;font:inherit}
th{text-align:left;color:var(--dim);font-weight:400;padding:0 8px 2px 0;border-bottom:1px solid var(--rule);text-shadow:none;vertical-align:bottom}
td{padding:3px 8px 3px 0;border-bottom:1px solid var(--hair);vertical-align:baseline;white-space:nowrap}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right;padding-right:0}
td .hb{display:inline-block;height:.55em;background:var(--fill);vertical-align:middle;margin-right:6px;box-shadow:0 0 6px rgba(237,165,46,.45)}
.cap{color:var(--dim);text-shadow:none;margin-top:6px}

/* the week: a grid of cells, one per step */
.g{display:grid;grid-template-columns:7.2em 1fr 3.4em;gap:3px 10px;align-items:center}
.g .hd{position:relative;height:1.1em}
.g .hd span{position:absolute;transform:translateX(-50%);color:var(--dim);text-shadow:none}
.g .lab{white-space:nowrap}
.g .tot{text-align:right;white-space:nowrap}
.g .row{display:grid;grid-template-columns:repeat(var(--n),1fr);height:1.15em;position:relative}
.g .row::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to right,transparent 0 calc(100%/var(--hrs) - 1px),#2A2010 calc(100%/var(--hrs) - 1px) calc(100%/var(--hrs)))}
.g .row i{display:block;position:relative;height:100%}
.g .c1{background:repeating-conic-gradient(#D9962A 0 25%,transparent 0 50%) 0 0/4px 4px}
.g .c2{background:var(--fill);box-shadow:0 0 5px rgba(237,165,46,.35)}
.g .c3{background:var(--bright);box-shadow:0 0 9px rgba(255,203,99,.7)}
.g .ci{background:radial-gradient(circle,#A87A2A 1.5px,transparent 2px)}
.g .row i:hover{outline:1px solid #FFE3A6;z-index:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:8px;color:var(--dim);text-shadow:none}
.legend i{display:inline-block;width:1.4em;height:.85em;vertical-align:-2px;margin-right:6px}

/* hours: 24 bars */
.hc{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;align-items:end;height:132px;margin-top:6px}
.hc i{display:block;background:var(--fill);box-shadow:0 0 6px rgba(237,165,46,.4)}
.hc i.pk{background:var(--bright);box-shadow:0 0 10px rgba(255,203,99,.7)}
.hc i.z{background:var(--hair);height:2px!important;box-shadow:none}
.hl{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;text-align:center;margin-top:3px}
.hl span{color:var(--dim);text-shadow:none;font-size:.9em;overflow:hidden}
.hl.p span{color:#B98A3A}

footer{margin-top:24px}
@media (max-width:900px){.two,.duo{grid-template-columns:1fr}}
@media print{body{background:#fff;color:#000}.crt{box-shadow:none;background:#fff;text-shadow:none}}
</style>

<div class="crt">
  <div class="bar rv" id="top"></div>
  <div class="two">
    <div class="col">
      <section id="verdict"></section>
      <section id="leaks"></section>
      <section id="keep"></section>
    </div>
    <div class="col">
      <section id="week"></section>
      <section id="hours"></section>
      <section id="calls"></section>
      <section id="tables"></section>
    </div>
  </div>
  <footer class="bar rv" id="foot"></footer>
</div>

<script>
const D = /*__DATA__*/null;
const K = D.kpi, N = D.notes || {}, $ = s=>document.querySelector(s);
const h  = x=> x>=10 ? x.toFixed(0) : x.toFixed(1);
const hm = s=> s<90 ? Math.round(s)+" s" : s<5400 ? (s/60).toFixed(s<600?1:0)+" min" : (s/3600).toFixed(1)+" h";
const pct= x=> Math.round(x*100)+"%";
const esc= s=> String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmm=d=> String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
const wd = k=> new Date(k+"T12:00").toLocaleDateString("en-GB",{weekday:"long"});
const wds= k=> new Date(k+"T12:00").toLocaleDateString("en-GB",{weekday:"short"});
const fmtD = k=> new Date(k+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const days = D.days.slice().sort((a,b)=> a.key<b.key?-1:1);
const best = days.reduce((a,b)=> b.work_h > (a?.work_h??-1) ? b : a, null);
const dk = days.map(d=>d.key);
const S = {}; for (const s of D.strengths) S[s.kind]=s;
const lev = K.elapsed_h ? K.work_h/K.elapsed_h : 0;
const ds = K.dead_h/K.elapsed_h;

/* top and bottom bars ------------------------------------------------------ */
$("#top").innerHTML = `<span><b>PITWALL</b><span>${fmtD(dk[0])} to ${fmtD(dk[dk.length-1])}</span><span>${K.n_sessions} sessions</span><span>${K.prompts} prompts</span><span>${days.length} active days</span></span>
  <span><span><b>${K.work_h.toFixed(1)} h</b> delivered</span><span><b>${K.idle_h.toFixed(1)} h</b> waited</span><span><b>${pct(ds)}</b> dead air</span></span>`;
$("#foot").innerHTML = `<span><span>local logs only, nothing leaves the machine</span><span>github.com/Maksim-Burtsev/pitwall</span></span><span>${D.days_window} full days before today, re-run weekly</span>`;

/* verdict ------------------------------------------------------------------ */
const verdict = N.week || `Your agents worked ${K.work_h.toFixed(1)} hours and waited for you ${K.idle_h.toFixed(1)}. ${ds>=.3?"Nearly a third":ds>=.2?"A quarter":ds>=.12?"A sixth":"A slice"} of your desk time, nothing ran at all.`;
const TILES = [
  {v:K.work_h.toFixed(1), u:"h", t:"agent-hours delivered", e:`inside ${h(K.elapsed_h)} desk hours`},
  {v:K.idle_h.toFixed(1), u:"h", t:"agent-hours waited", e:`${Math.round(K.idle_h/(K.idle_h+K.work_h)*60)} of every 60 minutes of an agent's life`},
  {v:pct(ds), u:"", t:"dead air", e:`${K.dead_h.toFixed(1)} desk hours with no agent running`},
  {v:lev.toFixed(2), u:"x", t:"leverage", e:"agent-hours per hour of yours"},
];
{ const hi=Math.max(2.5,K.fanout_potential+.4), X=v=>Math.round(v/hi*100);
  $("#verdict").innerHTML = `<h3><span class="rv"> VERDICT </span></h3>
    <div class="wr">${esc(verdict)}</div>
    <div class="tiles">${TILES.map(t=>`<div class="tile"><b class="n">${t.v}<small>${t.u}</small></b><span class="t">${t.t}</span><span class="e dim">${t.e}</span></div>`).join("")}</div>
    <div class="gauge"><i style="width:${X(K.fanout_actual)}%"></i><u style="width:${X(K.fanout_potential)-X(K.fanout_actual)}%"></u><span class="tick"></span><u style="width:${100-X(K.fanout_potential)}%"></u></div>
    <div class="wr" style="margin-top:6px">Your ceiling is <b>${K.fanout_potential.toFixed(1)} agents</b>: runs last ${hm(K.nt)}, your turnaround takes ${hm(K.it)}. You ran <b>${K.fanout_actual.toFixed(2)}</b> on average.</div>`; }

/* leaks -------------------------------------------------------------------- */
const L = []; const idle = K.idle_h || 1;
if (K.fanout_potential < 1.8) L.push([K.it/K.nt, "Human-bound", `median run ${hm(K.nt)}, median turnaround ${hm(K.it)}`,
  `The agent finishes before you can answer. More tabs cannot fix this; only longer runs can. Tasks that survive ten unattended minutes, and permissions that do not stop to ask.`]);
if (K.dead_h/K.elapsed_h > .18) L.push([K.dead_h/K.elapsed_h/.18, "Empty queue", `${K.dead_h.toFixed(1)} of ${h(K.elapsed_h)} desk hours with zero agents running`,
  `Everything finished, nothing was started. Not a capacity problem: a dispatch problem. The next prompt was not written before the current run ended.`]);
if (K.wtq_h/idle > .33) L.push([K.wtq_h/idle/.33, "Over-parallelized", `${K.wtq_h.toFixed(1)} of ${K.idle_h.toFixed(1)} idle hours were agents ready while you were in another session`,
  `The surplus tab is not producing. It is waiting for you, and charging the other sessions for it.`]);
if (K.wtsa_h/idle > .22) L.push([K.wtsa_h/idle/.22, "Reorientation tax", `${K.wtsa_h.toFixed(1)} idle hours that reading and typing cannot explain`,
  `Picking the thread back up after a switch. In the robotics studies this was the single largest sink. Unrelated contexts cost the full rebuild every time.`]);
if (K.switch_rate > 4) L.push([K.switch_rate/4, "Thrash", `${K.switch_rate.toFixed(1)} session switches an hour, ${K.switches} in the window`,
  `Faster than a context rebuilds. Finish a turn's worth of thinking in one session before touching the next.`]);
{ const dr = D.levers.find(l=>l.kind==="dropped");
  if (dr && dr.count >= 10) L.push([Math.min(dr.count/10, 1.5), "Abandoned work", `${dr.count} sessions finished real work and were never reopened`,
    `Output nobody read, sitting on branches. Review a finished session before opening the next, or do not open it.`]); }
L.sort((a,b)=>b[0]-a[0]);
$("#leaks").innerHTML = `<h3><span class="rv"> LEAKING </span><span class="sub">${L.length ? `${L.length} pattern${L.length>1?"s":""} fire on your numbers` : "nothing fires"}</span></h3>` +
  (L.length ? `<div class="list">${L.map(([,t,e,p])=>`<div><div class="h"><span><span class="rv"> ${t.toUpperCase()} </span></span></div><p class="wr">${esc(e)}</p><p class="wr dim">${esc(p)}</p></div>`).join("")}</div>`
   : `<div class="wr">The fleet is fed, the queue is full, and you are not thrashing. Keep the week.</div>`);

/* keep --------------------------------------------------------------------- */
const KEEP = [
  S.clean ? [String(S.clean.n), "clean runs of ten minutes or more", `The longest, ${hm(S.clean.longest)}, in ${esc(S.clean.where)}. Those tasks were specified well enough to be left alone. That is the shape to copy.`] : null,
  S.focus ? [pct(S.focus.share), "of busy time with a single agent", `Under a ${K.fanout_potential.toFixed(1)}-agent ceiling that is discipline, not timidity.`] : null,
  S.project ? [pct(S.project.efficiency), `efficiency in ${esc(S.project.project)}`, `${h(S.project.work_h)} agent-hours. Whatever the prompts look like there, they are the house style.`] : null,
  S.fast ? [hm(S.fast.it), `median reply on ${S.fast.task} tasks`, `Across ${S.fast.turns} turns, faster than the machine's own run. Here you are not the bottleneck.`] : null,
].filter(Boolean);
$("#keep").innerHTML = `<h3><span class="rv"> KEEP DOING </span><span class="sub">measured, not flattery</span></h3>
  <div class="list">${KEEP.map(([b,t,p])=>`<div><div class="h"><span><b>${b}</b>  ${t}</span></div><p class="wr dim">${p}</p></div>`).join("")}</div>`;

/* calls -------------------------------------------------------------------- */
const CT = {
  dispatch: l=>["Queue before you read",
    `${h(l.evidence.dead_h)} desk hours had nothing running, across ${l.evidence.windows} windows. The agents were done; nobody had told them what was next.`,
    `When an agent stops, write its next prompt first, then read its output. If it asked a question, answer it before you open anything new.`],
  parallel: l=>["Fewer tabs, calmer head",
    `${h(l.evidence.starved_h)} agent-hours sat finished and waiting while you worked elsewhere${Object.keys(l.evidence.held_by||{}).length?`, most often behind ${esc(Object.keys(l.evidence.held_by)[0])} sessions`:""}.`,
    `Hold at ${Math.max(1,Math.floor(K.fanout_potential))} session${Math.floor(K.fanout_potential)>1?"s that need":" that needs"} you. Anything beyond must run unattended from a plan, or stay closed.`],
  reorient: l=>["Protect the thread",
    `${h(l.evidence.drift_h)} hours went to picking threads back up after ${l.evidence.switches} switches, ${l.evidence.switch_rate.toFixed(1)} an hour.`,
    `Batch same-context work into one block. Before any switch, write the next step into the session you are leaving.`],
  dropped: l=>["Close what you open",
    `${l.count} sessions finished real work and were never reopened.`,
    `Review a finished session before opening the next one, or do not open it.`],
};
$("#calls").innerHTML = `<h3><span class="rv"> THREE CALLS </span><span class="sub">the changes that pay, ranked by agent-hours back</span></h3>
  <div class="list">${D.levers.slice(0,3).map((l,i)=>{ const [t,w,d]=CT[l.kind](l);
    return `<div><div class="h"><b>${i+1}. ${t.toUpperCase()}</b><span>${l.hours?`<b>+${h(l.hours)} h</b> <span class="dim">agent-hours back</span>`:`<b>${l.count}</b> <span class="dim">sessions</span>`}</span></div>
      <p class="wr">${w}</p><p class="wr"><span class="dim">&#9656;</span> ${d}</p></div>`; }).join("")}</div>
  <p class="wr dim" style="margin:8px 0 0">One rule behind all three: raise agent output by shaping the tasks, never by multiplying the threads your head holds at once. Every switch leaves residue on the next task, and an interrupted thread takes about twenty minutes to truly re-enter.</p>`;

/* the week ----------------------------------------------------------------- */
function mergeMs(spans, slack){ spans=spans.slice().sort((a,b)=>a[0]-b[0]); const out=[];
  for (const [a,b] of spans){ const Lx=out[out.length-1]; if (Lx && a-Lx[1]<=slack) Lx[1]=Math.max(Lx[1],b); else out.push([a,b]); } return out; }
const ovl=(a,b,c0,c1)=> Math.max(0,Math.min(b,c1)-Math.max(a,c0));
let h0=24, h1=0;
const prep = days.map(day=>{
  const mid=+new Date(day.key+"T00:00"), work=[], lanes=[];
  for (const l of day.lanes){ const sp=[]; for (const b of l.bars) if (b.k==="work"){ const s=[+new Date(b.a),+new Date(b.b)]; work.push(s); sp.push(s); }
    if (sp.length) lanes.push({project:l.project, title:l.title, spans:mergeMs(sp,0)}); }
  const w0=Math.min(...work.map(x=>x[0])), w1=Math.max(...work.map(x=>x[1]));
  const idle=[];
  for (const e of day.events){ if (e.kind!=="dead" && e.kind!=="starve") continue;
    const a=Math.max(+new Date(e.start), w0), b=Math.min(+new Date(e.end), w1);
    if (b-a >= 8*6e4) idle.push({a,b,kind:e.kind,n:e.n,holder:e.holder}); }
  for (const [a,b] of work){ h0=Math.min(h0,(a-mid)/36e5); h1=Math.max(h1,Math.min((b-mid)/36e5,24)); }
  return {day, mid, work, lanes, idle};
});
h0=Math.max(0,Math.floor(h0)); h1=Math.min(24,Math.ceil(h1));
const STEP = 12;
function cells(r){ const out=[]; const st=STEP*6e4;
  for (let t=r.mid+h0*36e5; t<r.mid+h1*36e5; t+=st){ const a=t, b=t+st;
    let n=0; const who=[]; for (const ln of r.lanes){ if (ln.spans.some(([x,y])=>ovl(x,y,a,b)>=2*6e4)) { n++; who.push(ln.project); } }
    let idle=null; if (!n) idle = r.idle.find(e=>ovl(e.a,e.b,a,b)>=3*6e4) || null;
    out.push({a,b,n,who,idle}); }
  return out; }
const tipFor = c=> c.n ? `${hhmm(new Date(c.a))}  ${c.n} agent${c.n>1?"s":""} working: ${[...new Set(c.who)].join(", ")}` :
  c.idle ? `${hhmm(new Date(c.idle.a))}-${hhmm(new Date(c.idle.b))}  you at the desk, fleet idle ${hm((c.idle.b-c.idle.a)/1e3)}\n${c.idle.kind==="dead"?"nothing queued":`${c.idle.n||2} agents starved${c.idle.holder?", behind "+esc(c.idle.holder):""}`}` : "";
{ const n=(h1-h0)*60/STEP, hrs=h1-h0;
  let hd=""; for (let hr=h0; hr<h1; hr+=2) hd+=`<span style="left:${(hr-h0)/hrs*100}%">${String(hr).padStart(2,"0")}</span>`;
  let rows=`<div></div><div class="hd">${hd}</div><div></div>`;
  for (const r of prep){
    const body=cells(r).map(c=>{ const cls=c.n>=3?"c3":c.n===2?"c2":c.n===1?"c1":c.idle?"ci":""; const tip=tipFor(c);
      return `<i class="${cls}"${tip?` title="${esc(tip)}"`:""}></i>`; }).join("");
    rows+=`<div class="lab">${wds(r.day.key)} ${fmtD(r.day.key)}</div><div class="row" style="--n:${n};--hrs:${hrs}">${body}</div><div class="tot">${r.day===best?`<b>${r.day.work_h.toFixed(1)} *</b>`:r.day.work_h.toFixed(1)}</div>`;
  }
  $("#week").innerHTML = `<h3><span class="rv"> THE WEEK </span><span class="sub">day by day, agent-hours on the right</span></h3>
    <div class="g">${rows}</div>
    <div class="legend"><span>one cell = ${STEP} min</span><span><i style="background:repeating-conic-gradient(#D9962A 0 25%,transparent 0 50%) 0 0/4px 4px"></i>one agent</span><span><i style="background:var(--fill)"></i>two</span><span><i style="background:var(--bright)"></i>three or more</span><span><i style="background:radial-gradient(circle,#A87A2A 1.5px,transparent 2px)"></i>you at the desk, fleet idle</span><span>* best day</span><span>hover a cell</span></div>`; }

/* hours -------------------------------------------------------------------- */
const HOURS = Array.from({length:24},()=>({sec:0,prompts:0}));
for (const r of prep){ for (const [a,z] of r.work){ let t=a; while (t<z){ const d0=new Date(t), hr=d0.getHours();
    const nxt=Math.min(z,+new Date(d0.getFullYear(),d0.getMonth(),d0.getDate(),hr+1)); HOURS[hr].sec+=(nxt-t)/1e3; t=nxt; } }
  for (const p of r.day.prompts) HOURS[new Date(p).getHours()].prompts++; }
{ const mxh=Math.max(...HOURS.map(x=>x.sec),1), pk=HOURS.findIndex(x=>x.sec===mxh);
  $("#hours").innerHTML = `<h3><span class="rv"> HOURS </span><span class="sub">all days folded</span></h3>
    <div class="hc">${HOURS.map((x,hr)=>`<i class="${x.sec?(hr===pk?"pk":""):"z"}" style="height:${Math.max(x.sec?3:0,x.sec/mxh*100)}%" title="${String(hr).padStart(2,"0")}:00  ${x.sec?hm(x.sec):"quiet"} agent work, ${x.prompts} prompts"></i>`).join("")}</div>
    <div class="hl">${HOURS.map((x,hr)=>`<span>${hr%3===0?String(hr).padStart(2,"0"):""}</span>`).join("")}</div>
    <div class="hl p">${HOURS.map(x=>`<span>${x.prompts||""}</span>`).join("")}</div>
    <div class="cap wr">agent work by hour of day; the tallest bar is ${hm(mxh)} at ${String(pk).padStart(2,"0")}:00. The small row is your prompts in that hour.</div>`; }

/* tables ------------------------------------------------------------------- */
{ const ORDER=["research","build","fix","ops","talk"];
  const ks = ORDER.filter(k=>D.kinds[k]&&D.kinds[k].turns>=3).map(k=>({k,...D.kinds[k]}));
  const mk = Math.max(...ks.map(x=>x.work_h),1), slow = Math.max(...ks.map(x=>x.it));
  const P = D.projects.filter(p=>p.work_h>=.5).sort((a,b)=>b.work_h-a.work_h).slice(0,7);
  const mp = Math.max(...P.map(p=>p.work_h),1), lo = Math.min(...P.map(p=>p.efficiency)), hi = Math.max(...P.map(p=>p.efficiency));
  $("#tables").innerHTML = `<div class="duo">
    <div><h3><span class="rv"> BY TASK KIND </span></h3>
      <table><tr><th>kind</th><th class="r">sessions</th><th class="r">agent-h</th><th class="r">turnaround</th><th class="r">starved</th></tr>
      ${ks.map(x=>`<tr><td>${x.k}</td><td class="r dim">${x.n}</td><td class="r"><span class="hb" style="width:${Math.max(2,x.work_h/mk*60)}px"></span>${x.work_h.toFixed(1)}</td><td class="r">${x.it===slow?`<b>${hm(x.it)}</b>`:hm(x.it)}</td><td class="r">${x.starved_h.toFixed(1)} h</td></tr>`).join("")}</table>
      <div class="cap wr">turnaround: median time from the agent stopping to your next prompt; bright is the slowest. Kinds come from what the agent did, so trust the direction, not the decimals.</div></div>
    <div><h3><span class="rv"> BY PROJECT </span></h3>
      <table><tr><th>project</th><th class="r">sessions</th><th class="r">agent-h</th><th class="r">efficiency</th><th class="r">starved</th></tr>
      ${P.map(p=>`<tr><td>${esc(p.project)}</td><td class="r dim">${p.sessions}</td><td class="r"><span class="hb" style="width:${Math.max(2,p.work_h/mp*60)}px"></span>${p.work_h.toFixed(1)}</td><td class="r">${p.efficiency===hi?`<b>${pct(p.efficiency)}</b>`:p.efficiency===lo?`<span class="rv">${pct(p.efficiency)}</span>`:pct(p.efficiency)}</td><td class="r">${(p.starved_h||0).toFixed(1)} h</td></tr>`).join("")}</table>
      <div class="cap wr">efficiency: share of the attention a project consumed that was an agent actually working; bright is the best, reverse the worst.</div></div>
  </div>`; }
</script>
